name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DbdMaxing.sln

      - name: Build
        run: dotnet build DbdMaxing.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DbdMaxing.Core.Tests -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish src/DbdMaxing.App/DbdMaxing.App.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DbdMaxing-win-x64
          path: publish/DbdMaxing.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/DbdMaxing.exe
