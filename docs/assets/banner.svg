<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140B22"/>
      <stop offset="1" stop-color="#07060B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B0A6B"/>
      <stop offset="0.6" stop-color="#5B1A9E"/>
      <stop offset="1" stop-color="#9D4DFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A1226" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#5B1A9E"/>

  <!-- perk-style diamonds -->
  <g filter="url(#glow)">
    <path d="M200 70 L290 160 L200 250 L110 160 Z" fill="#110D1A" stroke="#9D4DFF" stroke-width="3"/>
    <path d="M200 105 L255 160 L200 215 L145 160 Z" fill="url(#accent)" opacity="0.9"/>
  </g>
  <path d="M1080 40 L1140 100 L1080 160 L1020 100 Z" fill="none" stroke="#3B0A6B" stroke-width="2"/>
  <path d="M1150 150 L1200 200 L1150 250 L1100 200 Z" fill="none" stroke="#5B1A9E" stroke-width="2"/>
  <path d="M1030 190 L1060 220 L1030 250 L1000 220 Z" fill="#3B0A6B" opacity="0.6"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800">
    <text x="340" y="165" font-size="76" fill="#E8E0F5" letter-spacing="6">DBD<tspan fill="#9D4DFF" filter="url(#glow)">//</tspan>MAXING</text>
  </g>
  <text x="344" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#8A7FA0" letter-spacing="4">PERK SCANNER · BUILD OPTIMIZER · DEAD BY DAYLIGHT</text>
  <rect x="344" y="240" width="420" height="3" fill="url(#accent)" filter="url(#glow)"/>
</svg>
